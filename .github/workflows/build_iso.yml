on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

name: Build ISO

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container: 
      image: archlinux
      options: --privileged
    steps: 
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        shell: bash
        # Keep the rolling-release container in sync to avoid partial upgrades.
        run: pacman -Syu --noconfirm --needed archiso github-cli
      - name: Build ISO
        shell: bash
        run: mkarchiso -v .
      - name: Publish ISO release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          iso_files=(out/*.iso)
          if (( ${#iso_files[@]} != 1 )); then
            echo "Expected exactly one ISO in out/, found ${#iso_files[@]}" >&2
            exit 1
          fi
          (cd out && sha256sum -- *.iso > SHA256SUMS)
          tag="iso-$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "${iso_files[@]}" out/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "MINUX ML ${tag#iso-}" \
            --notes "Automated ISO build from commit ${GITHUB_SHA}. Verify the download with SHA256SUMS." \
            --latest
